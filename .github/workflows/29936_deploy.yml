name: 29936 deploy

on: 
  workflow_run:
    workflows: [ "Test CI"]
    types: 
      -comleted

jobs: 
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Prenesi artefakt
        uses: actions/download-artifact@v3
        with:
          name: napaka

      - name: Preveri napako
        run: |
          if [ -s napaka.txt ]; then
            echo "Napaka obstaja"
            exit 1
          fi
      
      - name: Docker prijava
        run: echo "${{ secrets.DOCKER_PASSWORD_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/moj-app:latest .
      
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/moj-app:latest
